name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/rust.mjs fmt --all -- --check
      - run: node scripts/rust.mjs test --locked
      - run: node scripts/rust.mjs clippy --all-targets --locked -- -D warnings
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:production
      - run: npm run desktop:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mihome-windows-unsigned
          path: src-tauri/target/release/mihome.exe
